name: Update README

on:
  workflow_dispatch:
  # This repository only receives events that happen here. Pull requests and
  # releases in other repositories show up through the public events API.
  schedule:
    - cron: "17 */6 * * *"
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: readme-activity
  cancel-in-progress: false

jobs:
  activity:
    name: Refresh recent activity
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Update activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: debangshu919
        run: python3 .github/scripts/update_activity.py

      - name: Commit activity
        run: |
          if git diff --quiet -- README.md; then
            echo "Activity section unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with recent activity"
          git push
